# factory-v0.4 frozen coverage specification.
# The runner is `fabline coverage-suite`; the frozen v0.3 core is kept by
# reference and is not modified.

[benchmark]
name = "factory-v0.4"
status = "frozen"
version = "0.4.0"
date = "2026-11-27"
world_version = "factory-0.1.0"
plan = "coverage-v0.4"
target_release = "0.5.0"
command = "python -m fabline coverage-suite --out results/factory-v0.4-coverage"
fast_command = "python -m fabline coverage-suite --out results/factory-v0.4-coverage-fast --fast"
expected = "benchmarks/factory-v0.4/expected/summary.json"
check = "python -m fabline coverage-suite --out results/factory-v0.4-coverage --skip-sequence --check-expected benchmarks/factory-v0.4/expected/summary.json"

[core]
# Kept by reference; v0.3 is frozen and unchanged.
benchmark = "factory-v0.3"
tasks = ["throughput-vector", "throughput-grid", "throughput-entities", "masked-grid", "bottleneck", "expand-control", "control-dynamics", "planning-triage", "fault-calibration", "causal-removal", "order-control", "order-planning"]

[coverage]
# Integrated in the draft runner.
integrated = ["reliability-contract", "partial-throughput", "wired-cascade", "crew-schedule", "crew-triage", "preventive-wire", "recipe-choice", "maintenance-threshold"]
# No additional coverage tasks are pending; freeze package is next.
proposed = []

[challenge]
tasks = ["crew-layouts", "decentralized-triage", "crew-replacement", "crew-replan-layouts", "maintenance-calibration"]

[reliability_contract]
task = "factory.power.contract.v1"
train_blocks = "600:998:2"
test_blocks = "601:999:2"
episodes_per_block = 10
tiers = "80:150:5"
cvar_alpha = 0.2
bootstrap_samples = 2000

[partial_throughput]
task = "factory.throughput.partial.v1"
episodes = 100
warmup_ticks = 150
episode_ticks = 300
sample_interval = 10
horizon = 50
dropout = 0.6
window = 4

[wired_cascade]
task = "factory.power.cascade.v1"
layouts = 200
seed_start = 500
max_faults_per_layout = 10
warmup_ticks = 50
split = "70/20/10 by layout"
status = "diagnostic; public graph gain below the +0.05 gate"

[crew_schedule]
task = "factory.power.crew-schedule.v1"
seeds = [800, 801, 802, 803, 804]
episodes = 5
q_train_episodes = 100
warning_tick = 40
failures = [90, 120, 150]
repair_budget = 2
success_score = 150

[crew_triage]
task = "factory.power.crew-triage.v1"
seeds = [12000, 12001, 12002, 12003, 12004]
episodes = 1
failure_recall_tick = 100
replan_jobs = 2
success_score = 300

[preventive_wire]
task = "factory.power.wire-maintenance.v1"
seeds = [0, 1, 2]
episodes = 5
q_train_episodes = 50
warning_tick = 60
failure_tick = 220
repair_ticks = 140
repair_budget = 1
success_score = 150

[recipe_choice]
task = "factory.production.recipe-choice.v1"
seeds = [37000, 37001, 37002, 37003, 37004]
episodes = 1
success_score = 150

[maintenance_threshold]
task = "factory.fault.preventive-threshold.v1"
seeds = [700, 701, 702, 703, 704]
training_episodes = 50
arms = [0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0]
success_score = 240

[expected]
summary = "benchmarks/factory-v0.4/expected/summary.json"
rtol = 0.03
atol = 0.02
check = "python -m fabline coverage-suite --out results/factory-v0.4-coverage --skip-sequence --check-expected benchmarks/factory-v0.4/expected/summary.json"
