name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,render]"

      - name: Lint
        run: |
          ruff check src tests
          mypy src

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Test
        run: pytest -q

      - name: Benchmark v0.3 regression
        run: |
          python -m fabline benchmark-v03 \
            --out /tmp/factory-v03-ci \
            --skip-v02-planning --skip-diagnostics --skip-production \
            --check-expected benchmarks/factory-v0.3/expected/summary.json
