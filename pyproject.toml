[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fabline"
version = "0.1.1"
description = "FABLINE: a deterministic factory testbed for learning methods, representations, and theories."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-docs", "NOTICE"]
authors = [{ name = "MrHuumies" }]
dependencies = [
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "scikit-learn>=1.5",
]
render = [
  "pygame-ce>=2.5",
]
train = [
  "torch>=2.4",
  "scikit-learn>=1.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fabline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["perf: performance tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.sdist]
exclude = [
  "/.hypothesis",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.mypy_cache",
  "/dist",
  "/results",
  "/datasets",
  "/release",
]
